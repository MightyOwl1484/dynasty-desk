name: Validate Dynasty Desk

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate legacy prototype and Godot foundation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Build browser distribution
        run: node scripts/build.mjs

      - name: Check JavaScript syntax
        run: node --check dist/app.js

      - name: Run domain tests
        run: node --test

      - name: Check self-contained browser build
        run: node scripts/check-browser-build.mjs

      - name: Check accessibility structure
        run: node scripts/check-a11y.mjs

      - name: Check offline asset cache
        run: node scripts/check-pwa.mjs

      - name: Check SPFx source scaffold
        run: node scripts/check-spfx.mjs

      - name: Check SPFx deployment readiness
        run: node scripts/check-spfx-deployment.mjs

      - name: Check SharePoint schema
        run: node scripts/check-sharepoint-schema.mjs

      - name: Check Godot project foundation
        run: node scripts/check-godot-scaffold.mjs

      - name: Test Python content tooling
        run: python -m unittest discover -s tools/tests

      - name: Check prototype arena balance thresholds
        run: python tools/analyze_balance.py --samples 100 --strict

      - name: Parse Godot main scene
        run: godot --headless --path game --quit-after 3

      - name: Run Godot simulation tests
        run: godot --headless --path game --script res://tests/run_tests.gd

      - name: Export Godot web build
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release Web "$GITHUB_WORKSPACE/build/web/index.html"
          touch build/web/.nojekyll

      - name: Check Godot web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Upload Godot web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-desk-arena-web
          path: build/web
          if-no-files-found: error

      - name: Check required prototype files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/manifest.webmanifest
          test -f dist/commissioner.html
          test -f dist/commissioner.js
          test -f dist/admin.css
          test -f LICENSE
          test -f NOTICE

      - name: Check documentation links
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/PRODUCT_PLAN.md docs/ROADMAP.md docs/ARCHITECTURE.md docs/DEPLOYMENT.md docs/REFERENCE_PROJECTS.md docs/adr/0001-godot-pivot.md docs/SHAREPOINT_MULTIPLAYER.md docs/SHAREPOINT_PROVISIONING.md docs/DESIGN_REVIEW.md docs/GAMEPLAY_REVIEW.md CONTRIBUTING.md; do
            test -f "$file"
          done
