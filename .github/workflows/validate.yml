name: Validate Dynasty Desk

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static prototype
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check dist/app.js

      - name: Run domain tests
        run: node --test

      - name: Check accessibility structure
        run: node scripts/check-a11y.mjs

      - name: Build browser domain modules
        run: node scripts/build.mjs

      - name: Check required prototype files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/manifest.webmanifest
          test -f LICENSE
          test -f NOTICE

      - name: Check documentation links
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/PRODUCT_PLAN.md docs/ARCHITECTURE.md docs/SHAREPOINT_MULTIPLAYER.md CONTRIBUTING.md; do
            test -f "$file"
          done
