name: Deploy Godot game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Run Godot tests
        run: godot --headless --path game --script res://tests/run_tests.gd

      - name: Export web release
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release Web "$GITHUB_WORKSPACE/build/web/index.html"
          touch build/web/.nojekyll

      - name: Check web release
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    name: Publish web release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
